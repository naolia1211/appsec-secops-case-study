name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t appsec-demo:${{ github.sha }} .
      - name: Save image for subsequent jobs
        run: docker save appsec-demo:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar
          retention-days: 1
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
  security:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-security.txt
      - name: Semgrep JSON scan and security gate
        run: python scripts/run_sast.py
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: reports/sast/semgrep.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@v4
        with:
          name: built-image
      - name: Publish approved image
        uses: actions/upload-artifact@v4
        with:
          name: approved-image-${{ github.sha }}
          path: image.tar
          retention-days: 7
  deploy_mock:
    name: Deploy mock
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: approved-image-${{ github.sha }}
      - name: Start approved image
        run: |
          docker load -i image.tar
          docker run -d --name mock-app -p 127.0.0.1:8080:8080 appsec-demo:${{ github.sha }}
      - name: Check deployed API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-results
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors --max-time 3 --retry-max-time 30 http://127.0.0.1:8080/health -o deploy-results/health.json
          curl --fail --silent --show-error --max-time 5 'http://127.0.0.1:8080/api/greeting?name=CI' -o deploy-results/greeting.json
          python3 -c 'import json; assert json.load(open("deploy-results/health.json")) == {"status": "ok"}; assert json.load(open("deploy-results/greeting.json")) == {"message": "Hello, CI!"}'
          echo '### Deploy mock: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'The approved image started successfully; health and greeting responses passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Collect logs and stop container
        if: always()
        shell: bash
        run: |
          mkdir -p deploy-results
          if docker container inspect mock-app > /dev/null 2>&1; then
            docker logs mock-app > deploy-results/container.log 2>&1
            docker rm -f mock-app
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-results
          path: deploy-results/
          if-no-files-found: warn
          retention-days: 30
  kubernetes:
    name: Kubernetes hardening
    needs: deploy_mock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: approved-image-${{ github.sha }}
      - name: Load Task 1 image and record identity
        run: |
          docker load -i image.tar
          mkdir -p reports/task1
          docker image inspect appsec-demo:${{ github.sha }} --format '{"image":"appsec-demo:${{ github.sha }}","image_id":"{{.Id}}","source":"GitHub Actions Task 1 gate"}' > reports/task1/approved-image.json
      - name: Create lab and verify hardening
        run: |
          docker compose -f docker-compose.k8s.yml build lab
          docker compose -f docker-compose.k8s.yml run --rm lab all
      - name: Upload Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-evidence
          path: reports/k8s/last-run/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove lab
        if: always()
        run: docker compose -f docker-compose.k8s.yml run --rm lab destroy
