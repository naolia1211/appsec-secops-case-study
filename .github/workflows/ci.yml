name: Task 1 - Build Test Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t concung-demo:${{ github.sha }} .
      - name: Save image for subsequent jobs
        run: docker save concung-demo:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar
          retention-days: 1
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit tests including gate pass and block cases
        run: python -m pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: built-image
      - name: Smoke test built image
        shell: bash
        run: |
          set -euo pipefail
          docker load -i image.tar
          docker run -d --name demo -p 127.0.0.1:8080:8080 concung-demo:${{ github.sha }}
          trap 'docker logs demo; docker rm -f demo' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/health
  security:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-security.txt
      - name: Semgrep JSON scan and security gate
        run: python scripts/run_sast.py
      - name: Preserve scan evidence even when gate blocks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: reports/sast/semgrep.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@v4
        with:
          name: built-image
      - name: Release approved image artifact for later tasks
        uses: actions/upload-artifact@v4
        with:
          name: approved-image-${{ github.sha }}
          path: image.tar
          retention-days: 7
