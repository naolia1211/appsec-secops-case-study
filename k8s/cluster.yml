apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: appsec-lab
servers: 1
agents: 1
image: rancher/k3s:v1.32.5-k3s1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6550"
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable=servicelb
        nodeFilters: [server:*]
      - arg: --tls-san=k3d-appsec-lab-server-0
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
